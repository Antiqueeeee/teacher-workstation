[project]
name = "teacher-workstation-backend"
version = "0.1.0"
description = "班主任工作台 —— 本地后端服务（FastAPI + SQLAlchemy + SQLite）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13",
    "pydantic>=2.7,<3.0",
    "openpyxl>=3.1",
    "pillow>=10.0",
    "mutagen>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
